# SwiftLint Configuration — The Arc
# Focus: speed, availability, safety

excluded:
  - DerivedData
  - .build
  - Pods
  - Packages

# ── Enabled opt-in rules (performance + safety) ──
opt_in_rules:
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
  - private_action
  - private_outlet
  - overridden_super_call
  - redundant_nil_coalescing
  - closure_spacing
  - operator_usage_whitespace
  - return_arrow_whitespace
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - implicit_return
  - multiline_arguments
  - multiline_parameters
  - force_unwrapping

# ── Disabled rules ──
disabled_rules:
  - trailing_comma
  - todo

# ── Rule configuration ──
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 6
  error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

force_cast: error
force_try: error
force_unwrapping: error

reporter: xcode
